name: sync-service

on:
  push:
    branches: ['main', 'release/**']
    paths:
      - 'packages/electric-telemetry/**'
      - 'packages/sync-service/**'
      - '.github/workflows/sync_service_tests.yml'
  pull_request:
    paths:
      - 'packages/electric-telemetry/**'
      - 'packages/sync-service/**'
      - '.github/workflows/sync_service_tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # erlef/setup-beam picks its Erlang/OTP build from ImageOS, which only GitHub's own images set
  ImageOS: ubuntu24
  # Set repository variable PUBLIC_DNS_UNAVAILABLE=true in environments without public DNS
  PUBLIC_DNS_UNAVAILABLE: ${{ vars.PUBLIC_DNS_UNAVAILABLE }}

permissions:
  contents: read
  packages: read

jobs:
  build_and_test:
    name: 'Build and test sync-service, pg${{ matrix.postgres_version }}'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/sync-service
    strategy:
      fail-fast: false
      matrix:
        postgres_version: [18]
    env:
      MIX_ENV: test
      MIX_TARGET: application
      POSTGRES_VERSION: '${{ matrix.postgres_version }}0000'
    services:
      postgres:
        image: 'ghcr.io/beeldi/electric/postgres:${{ matrix.postgres_version }}-alpine-logical'
        credentials: &ghcr_credentials
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: password
        options: &postgres_health_check >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 54321:5432

      pgbouncer: &pgbouncer_service
        image: ghcr.io/beeldi/electric/bitnamilegacy/pgbouncer:latest
        credentials: *ghcr_credentials
        env:
          PGBOUNCER_AUTH_TYPE: trust
          PGBOUNCER_DATABASE: '*'
          PGBOUNCER_POOL_MODE: transaction
          POSTGRESQL_HOST: postgres
          POSTGRESQL_DATABASE: electric
          POSTGRESQL_USERNAME: postgres
          POSTGRESQL_PASSWORD: password
        ports:
          - 65432:6432
    steps:
      - &checkout_source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - &seed_database
        name: Seed the database
        # Run psql inside the service container so the runner does not need a local Postgres client
        run: docker exec --interactive ${{ job.services.postgres.id }} psql -d 'postgresql://postgres:password@localhost:5432/postgres?sslmode=disable' < dev/init.sql

      - &setup_beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-type: strict
          version-file: '.tool-versions'

      - &cache_dependencies
        name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/sync-service/deps
          key: "${{ runner.os }}-${{ hashFiles('.tool-versions') }}-sync-service-deps-${{ env.MIX_ENV }}-${{ hashFiles('packages/sync-service/mix.lock') }}"
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-sync-service-deps-${{ env.MIX_ENV }}-${{ hashFiles('packages/sync-service/mix.lock') }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-sync-service-deps-${{ env.MIX_ENV }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-sync-service-deps

      - &cache_compiled_code
        name: Cache compiled code
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            packages/sync-service/_build/*/lib
            !packages/sync-service/_build/*/lib/electric
            !packages/sync-service/_build/*/lib/electric_telemetry
          key: "${{ runner.os }}-${{ hashFiles('.tool-versions') }}-sync-service-build-${{ env.MIX_ENV }}-${{ hashFiles('packages/sync-service/mix.lock') }}"
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-sync-service-build-${{ env.MIX_ENV }}-${{ hashFiles('packages/sync-service/mix.lock') }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-sync-service-build-${{ env.MIX_ENV }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-sync-service-build

      - &install_dependencies
        name: Install dependencies
        run: mix do deps.get + deps.compile

      - &compile_package
        name: Compile package
        run: mix compile

      - name: Run tests
        # 120s per-test budget: the slow-tagged high-concurrency tests seed
        # thousands of shapes through unconsolidated protocol dispatch, which
        # grazes the 60s default on 2-vCPU shared runners.
        run: mix coveralls.json --include slow --timeout 120000 --cover --export-coverage test

  perf_features_test:
    name: 'Build and test sync-service with the perf features on, pg18'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/sync-service
    env:
      MIX_ENV: test
      MIX_TARGET: application
      POSTGRES_VERSION: '180000'
      # Everything this fork adds ships off, so the default lane above only ever exercises the
      # code these features replace. Running the same suite with them on is what stops a test
      # from silently assuming the default, and it is how the defects below were found.
      ELECTRIC_SHARED_CONVERSION: 'true'
      ELECTRIC_SHARED_PAYLOAD_ARENA: 'true'
      ELECTRIC_SHARED_FRAGMENT_BLOCKS: 'true'
      ELECTRIC_WORKER_PREPARE: 'true'
      ELECTRIC_ROUTER_SHARDS: '4'
      ELECTRIC_INGEST_PRIORITY_HIGH: 'true'
      ELECTRIC_FILTER_ROUTING_MEMO: 'true'
      ELECTRIC_ACK_AFTER_JOURNAL: 'true'
      ELECTRIC_REPLICATION_PIPELINE_WINDOW: '4'
      # ELECTRIC_SHARED_CONVERSION has to stay set for the three above it to do anything: they
      # only decide how a shared conversion is packaged, and without one they turn themselves
      # off. Dropping it would leave this lane green while testing nothing.
      #
      # ELECTRIC_ACK_AFTER_JOURNAL and ELECTRIC_REPLICATION_PIPELINE_WINDOW used to drop
      # subquery-shape move-in events outright: with ingest running ahead of fan-out, the
      # keepalive-fed last-seen LSN feed regressed and buffered move-ins waited forever on a
      # boundary that had already been seen. The replication client now holds keepalive
      # positions until its pipeline drains, so both run here.
    services:
      postgres:
        image: 'ghcr.io/beeldi/electric/postgres:18-alpine-logical'
        credentials: *ghcr_credentials
        env:
          POSTGRES_PASSWORD: password
        options: *postgres_health_check
        ports:
          - 54321:5432

      pgbouncer: *pgbouncer_service
    steps:
      - *checkout_source
      - *seed_database
      - *setup_beam
      - *cache_dependencies
      - *cache_compiled_code
      - *install_dependencies
      - *compile_package

      - name: Run tests with the perf features on
        run: mix test --include slow --timeout 120000

  oracle_property_test:
    name: 'Oracle property test, pg18'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/sync-service
    env:
      MIX_ENV: test
      MIX_TARGET: application
      POSTGRES_VERSION: '180000'
      CHECK_TIMEOUT: 60000
      SHAPE_COUNT: 200
      MUTATIONS_PER_TXN: 10
      TXNS_PER_BATCH: 10
      BATCH_COUNT: 50
      SKIP_REPATCH_PREWARM: 'true'
    services:
      postgres:
        image: 'ghcr.io/beeldi/electric/postgres:18-alpine-logical'
        credentials: *ghcr_credentials
        env:
          POSTGRES_PASSWORD: password
        options: *postgres_health_check
        ports:
          - 54321:5432

      pgbouncer: *pgbouncer_service
    steps:
      - *checkout_source
      - *seed_database
      - *setup_beam
      - *cache_dependencies
      - *cache_compiled_code
      - *install_dependencies
      - *compile_package

      - name: Run oracle property test
        run: mix test --only oracle test/integration/oracle_property_test.exs

  oracle_property_test_with_restarts:
    name: 'Oracle property test with restarts (${{ matrix.restart_type }}, perf flags ${{ matrix.perf_flags }})'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/sync-service
    strategy:
      fail-fast: false
      matrix:
        restart_type: [graceful, brutal]
        # Upstream runs this lane flags-off only. The flags-on axis is the fork's own
        # guard: a crash or restore must stay consistent with the journal, pipelined
        # ingest and shared-conversion machinery in the write path.
        perf_flags: ['off', 'on']
    env:
      MIX_ENV: test
      MIX_TARGET: application
      POSTGRES_VERSION: '180000'
      CHECK_TIMEOUT: 60000
      SHAPE_COUNT: 200
      MUTATIONS_PER_TXN: 10
      TXNS_PER_BATCH: 10
      BATCH_COUNT: 50
      SKIP_REPATCH_PREWARM: 'true'
      RESTART_SERVER_EVERY: 3
      RESTART_TYPE: ${{ matrix.restart_type }}
      TEST_POOL_SIZE: 20
      ELECTRIC_SHARED_CONVERSION: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_SHARED_PAYLOAD_ARENA: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_SHARED_FRAGMENT_BLOCKS: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_WORKER_PREPARE: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_ROUTER_SHARDS: ${{ matrix.perf_flags == 'on' && '4' || '1' }}
      ELECTRIC_INGEST_PRIORITY_HIGH: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_FILTER_ROUTING_MEMO: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_ACK_AFTER_JOURNAL: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_REPLICATION_PIPELINE_WINDOW: ${{ matrix.perf_flags == 'on' && '4' || '1' }}
    services:
      postgres:
        image: 'ghcr.io/beeldi/electric/postgres:18-alpine-logical'
        credentials: *ghcr_credentials
        env:
          POSTGRES_PASSWORD: password
        options: *postgres_health_check
        ports:
          - 54321:5432

      pgbouncer: *pgbouncer_service
    steps:
      - *checkout_source
      - *seed_database
      - *setup_beam
      - *cache_dependencies
      - *cache_compiled_code
      - *install_dependencies
      - *compile_package

      - name: Run oracle property test with restarts
        run: mix test --only oracle test/integration/oracle_property_test.exs

  performance_test:
    name: 'Performance test, pg18 (perf flags ${{ matrix.perf_flags }})'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/sync-service
    strategy:
      fail-fast: false
      matrix:
        # The perf features rewrite the conversion, routing and ingest path they are
        # meant to speed up, so a throughput or allocation regression there is invisible
        # while the benchmarks only ever run against the code those features replace. The
        # on axis is what qualifies the combined config the fork actually ships toward.
        perf_flags: ['off', 'on']
    env:
      MIX_ENV: test
      MIX_TARGET: application
      POSTGRES_VERSION: '180000'
      SKIP_REPATCH_PREWARM: 'true'
      ELECTRIC_SHARED_CONVERSION: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_SHARED_PAYLOAD_ARENA: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_SHARED_FRAGMENT_BLOCKS: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_WORKER_PREPARE: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_ROUTER_SHARDS: ${{ matrix.perf_flags == 'on' && '4' || '1' }}
      ELECTRIC_INGEST_PRIORITY_HIGH: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_FILTER_ROUTING_MEMO: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_ACK_AFTER_JOURNAL: ${{ matrix.perf_flags == 'on' && 'true' || 'false' }}
      ELECTRIC_REPLICATION_PIPELINE_WINDOW: ${{ matrix.perf_flags == 'on' && '4' || '1' }}
    services:
      postgres:
        image: 'ghcr.io/beeldi/electric/postgres:18-alpine-logical'
        credentials: *ghcr_credentials
        env:
          POSTGRES_PASSWORD: password
        options: *postgres_health_check
        ports:
          - 54321:5432

      pgbouncer: *pgbouncer_service
    steps:
      - *checkout_source
      - *seed_database
      - *setup_beam
      - *cache_dependencies
      - *cache_compiled_code
      - *install_dependencies
      - *compile_package

      - name: Run performance test
        run: mix test --only performance
