name: elixir-client

on:
  push:
    branches: ['main', 'release/**']
    paths:
      - 'packages/elixir-client/**'
      - '.github/workflows/elixir_client_tests.yml'
  pull_request:
    paths:
      - 'packages/elixir-client/**'
      - '.github/workflows/elixir_client_tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # erlef/setup-beam picks its Erlang/OTP build from ImageOS, which only GitHub's own images set
  ImageOS: ubuntu24

permissions:
  contents: read
  packages: read

jobs:
  build_and_test:
    name: Build and test elixir-client
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/elixir-client
    env:
      MIX_ENV: test
      ELECTRIC_PORT: 3100
      DATABASE_URL: 'postgresql://postgres:password@127.0.0.1:54323/postgres?sslmode=disable'
    services:
      postgres:
        image: 'ghcr.io/beeldi/electric/postgres:18-alpine-logical'
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 54323:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-type: strict
          version-file: '.tool-versions'

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/elixir-client/deps
          key: ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-elixir-client-deps-${{ env.MIX_ENV }}-${{ hashFiles('packages/elixir-client/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-elixir-client-deps-${{ env.MIX_ENV }}-${{ hashFiles('packages/elixir-client/mix.lock') }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-elixir-client-deps-${{ env.MIX_ENV }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-elixir-client-deps

      - name: Cache compiled code
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            packages/elixir-client/_build/*/lib
            !packages/elixir-client/_build/*/lib/electric_client
          key: "${{ runner.os }}-${{ hashFiles('.tool-versions') }}-elixir-client-build-${{ env.MIX_ENV }}-${{ hashFiles('packages/elixir-client/mix.lock') }}"
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-elixir-client-build-${{ env.MIX_ENV }}-${{ hashFiles('packages/elixir-client/mix.lock') }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-elixir-client-build-${{ env.MIX_ENV }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-elixir-client-build

      - name: Install dependencies
        run: mix do deps.get + deps.compile

      - name: Compile package
        run: mix compile

      - name: Run tests
        run: mix coveralls.json
