name: Elixir formatting

on:
  pull_request:
    paths:
      - 'packages/electric-telemetry/**'
      - 'packages/elixir-client/**'
      - 'packages/sync-service/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # erlef/setup-beam picks its Erlang/OTP build from ImageOS, which only GitHub's own images set
  ImageOS: ubuntu24

permissions:
  contents: read

jobs:
  elixir_check_formatting:
    strategy:
      matrix:
        package: [sync-service, elixir-client, electric-telemetry]
    name: Check Elixir formatting and compilation issues
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    env:
      MIX_ENV: test
      MIX_TARGET: application
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-type: strict
          version-file: '.tool-versions'

      - name: Restore dependencies cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/${{ matrix.package }}/deps
          key: "${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ matrix.package }}-deps-${{ env.MIX_ENV }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}"
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ matrix.package }}-deps-${{ env.MIX_ENV }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ matrix.package }}-deps-${{ env.MIX_ENV }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ matrix.package }}-deps

      - name: Restore compiled code
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            packages/${{ matrix.package }}/_build/*/lib
            !packages/${{ matrix.package }}/_build/*/lib/electric
            !packages/${{ matrix.package }}/_build/*/lib/electric_client
            !packages/${{ matrix.package }}/_build/*/lib/electric_telemetry
          key: "${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ matrix.package }}-build-${{ env.MIX_ENV }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}"
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ matrix.package }}-build-${{ env.MIX_ENV }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ matrix.package }}-build-${{ env.MIX_ENV }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ matrix.package }}-build

      - name: Install dependencies
        run: mix deps.get

      - name: Check Elixir formatting
        run: mix format --check-formatted

      - name: Check the package compiles without warnings
        run: mix compile --force --all-warnings --warnings-as-errors
