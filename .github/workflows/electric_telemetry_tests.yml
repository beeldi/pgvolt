name: electric-telemetry

on:
  push:
    branches: ['main', 'release/**']
    paths:
      - 'packages/electric-telemetry/**'
  pull_request:
    paths:
      - 'packages/electric-telemetry/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # erlef/setup-beam picks its Erlang/OTP build from ImageOS, which only GitHub's own images set
  ImageOS: ubuntu24

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and test electric-telemetry
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/electric-telemetry
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-type: strict
          version-file: '.tool-versions'

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/electric-telemetry/deps
          key: ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-electric-telemetry-deps-${{ env.MIX_ENV }}-${{ hashFiles('packages/electric-telemetry/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-electric-telemetry-deps-${{ env.MIX_ENV }}-${{ hashFiles('packages/electric-telemetry/mix.lock') }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-electric-telemetry-deps-${{ env.MIX_ENV }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-electric-telemetry-deps

      - name: Cache compiled code
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            packages/electric-telemetry/_build/*/lib
            !packages/electric-telemetry/_build/*/lib/electric_telemetry
          key: "${{ runner.os }}-${{ hashFiles('.tool-versions') }}-electric-telemetry-build-${{ env.MIX_ENV }}-${{ hashFiles('packages/electric-telemetry/mix.lock') }}"
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-electric-telemetry-build-${{ env.MIX_ENV }}-${{ hashFiles('packages/electric-telemetry/mix.lock') }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-electric-telemetry-build-${{ env.MIX_ENV }}
            ${{ runner.os }}-${{ hashFiles('.tool-versions') }}-electric-telemetry-build

      - name: Install dependencies
        run: mix do deps.get + deps.compile

      - name: Compile package
        run: mix compile

      - name: Run tests
        run: mix coveralls.json
