services:
  electric:
    image: $ELECTRIC_IMAGE
    env_file: ../.env.dev
    environment:
      DATABASE_URL: 'postgresql://postgres:password@postgres/electric?sslmode=disable'
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -qE '^HTTP/1\\.[01] 2[0-9]{2} '"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
